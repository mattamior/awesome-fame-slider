  - Earlier CI exposed and resolved workflow caching and Vite typing issues.
  - CI run 18 (commit be4542b6687c9f60c5ba7d96bc38729f43378750) succeeded after removing fabricated fallback votes, adding live polling, and mobile hardening.
  - CI run 27 (commit f3c2ab5a9cb28f9473261e6bb7d406a0084eef6a) succeeded after the production Deploy workflow and RPM documentation were added.
