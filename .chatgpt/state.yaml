summary: >-
  The MVP is live at https://awesome-fame-slider.mattamior.workers.dev and the repository now
  implements AI-Native Repository Delivery: ChatGPT operates GitHub directly, CI validates
  product-relevant main-branch commits, and a successful push CI automatically triggers a serialized
  production Deploy for the exact passing SHA. Deploy reuses/provisions D1 as needed, applies
  migrations, deploys the Worker/assets, discovers the workers.dev URL, and requires /api/health
  plus /api/ready to pass. Normal releases now require no local checkout and no manual Run workflow
  click; workflow_dispatch remains only as a fallback.
current_focus: >-
  Verify the live product end to end in a real browser: anonymous vote creation/update semantics,
  aggregate refresh, X Web Intent composition, social-card metadata/image rendering, and mobile/X
  in-app browser behavior. Continue refining and documenting the AI-Native Repository Delivery
  operating model as a reusable development pattern.
confirmed_constraints:
  - GitHub repository: mattamior/awesome-fame-slider.
  - Product display name remains Slide Rheostat for now.
  - Production URL: https://awesome-fame-slider.mattamior.workers.dev.
  - Vite + React + TypeScript frontend.
  - Cloudflare Worker name: awesome-fame-slider.
  - Cloudflare D1 database name: awesome-fame-slider-db.
  - Cloudflare Worker and D1 exist in production.
  - Cloudflare Workers is the unified deployment target.
  - Cloudflare D1 stores anonymous active votes and lightweight rate-limit state.
  - Initial roster: Liang Wenfeng, Elon Musk, Sam Altman, Jensen Huang, Mark Zuckerberg, Dario Amodei, Demis Hassabis, and Tibo Sottiaux.
  - Voting and X sharing are independent actions.
  - One active vote per anonymous browser device per person; later votes from the same device/person update that vote.
  - The browser identifier is a random HttpOnly cookie; only its SHA-256-derived identifier is stored in D1.
  - Voter/rate-limit hashing uses a fixed application namespace rather than deployment origin.
  - Network rate limiting discourages rapid vote abuse without storing raw request IPs.
  - X sharing uses Web Intent and must not require an X Developer App, OAuth credentials, or paid X API writes.
  - Shared result URLs expose crawler-friendly metadata and a 1200x675 PNG result card.
  - Share metadata derives its origin from the incoming request, so workers.dev and future custom domains work without APP_ORIGIN configuration.
  - Each person page displays aggregate voting distribution and the modal community rank.
  - Community results must never fall back to fabricated sample votes.
  - Production deployment requires only CF_API_TOKEN and CF_ACCOUNT_ID.
  - Normal production delivery is CI-gated and automatic after successful push CI on main.
  - Deploy checks out the exact workflow_run.head_sha that passed CI.
  - Pull-request CI cannot enter the production deploy path; automatic deploy requires workflow_run.event == push and head_branch == main.
  - Production deploys are serialized with a production-deploy concurrency group and are not cancelled mid-run.
  - Pure .chatgpt/**, docs/**, and README.md commits are ignored by push CI so RPM/docs updates do not deploy production.
  - workflow_dispatch remains available only as a manual recovery/re-run path.
implemented:
  - React/Vite/TypeScript project scaffold and eight-person data-driven roster.
  - Six-position rheostat interaction, rank labels, community vote distribution, and leader display.
  - Neutral rank for zero-vote community state and neutral-biased tie-breaking in Worker and client.
  - No fabricated fallback vote counts; failed API loads display explicit offline state and zero bars.
  - Aggregate vote polling every 30 seconds while visible plus refresh on foreground/person changes.
  - D1-backed anonymous vote endpoint at POST /api/people/:personId/vote.
  - Random HttpOnly browser-device cookie with only a SHA-256-derived voter identifier persisted in D1.
  - One anonymous active vote per device/person via D1 upsert semantics.
  - D1-backed per-network vote-write rate limiting with raw IPs never stored.
  - Free X Web Intent sharing with pre-populated verdict text and a stable /share/:person/:rank URL.
  - Worker-generated share landing pages with Open Graph and X summary_large_image metadata.
  - Build-time generation of 48 1200x675 PNG result cards using Sharp.
  - Human share-link visitors are redirected into the app with person/rank preselected.
  - /api/ready requires only the anonymous-vote/rate-limit tables.
  - Cloudflare static-asset routing runs Worker-first for /api/* and /share/*.
  - Mobile hardening for safe areas, narrow layouts, touch targets, horizontal roster scrolling, and reduced motion.
  - GitHub Actions CI for install, tests, build/share-card generation, and Wrangler type generation.
  - CI ignores pure RPM/docs/README changes to avoid meaningless releases.
  - GitHub Actions Deploy is triggered automatically by successful push CI on main and retains manual workflow_dispatch fallback.
  - Deploy verifies and checks out the exact CI-passing SHA before building/deploying.
  - Deploy automatically discovers or creates awesome-fame-slider-db, applies migrations, deploys Worker/assets, discovers the workers.dev URL, and checks health/readiness.
  - Production deployment concurrency prevents overlapping deploy/migration runs.
  - Repository/package/frontend links and infrastructure naming are synchronized to awesome-fame-slider.
  - Production deployment is live at https://awesome-fame-slider.mattamior.workers.dev.
  - Reusable AI-Native Repository Delivery playbook is stored at docs/CHATGPT_GITHUB_CLOUDFLARE_PLAYBOOK.md.
removed_from_current_flow:
  - X OAuth 2.0 PKCE authorization.
  - X media upload and POST /2/tweets calls.
  - X_CLIENT_ID and X_CLIENT_SECRET deployment requirements.
  - Vote-on-successful-X-post semantics.
  - X-account identity as the voting key.
  - APP_ORIGIN runtime/deployment requirement.
  - Manual Run workflow as a normal release requirement.
blockers:
