confirmed_constraints:
  - Product display name is Awesome Fame Slider.
  - The phrase reputation rheostat remains a descriptive concept/tagline, not the product name.
  - Frontend is Vite + React + TypeScript.
  - Cloudflare Workers is the unified deployment target; D1 stores anonymous active votes and rate-limit state.
  - Initial roster is Liang Wenfeng, Elon Musk, Sam Altman, Tibo Sottiaux, Jensen Huang, Mark Zuckerberg, Dario Amodei, and Demis Hassabis.
  - Voting and X sharing are independent actions.
  - One active anonymous vote is kept per browser device/person; later votes update that row.
  - Community results never fall back to fabricated sample votes.
  - X sharing uses free Web Intent / native Web Share mechanics; no X Developer App or paid X write API is required.
  - Shared verdict pages expose crawler-friendly metadata and a 1200x675 PNG for the exact selected rank.
  - Social-card URLs carry an explicit revision query parameter so crawler and CDN caches can be invalidated safely.
  - Chinese/English is a user-facing product setting. First visit follows browser language; an explicit choice persists locally.
  - Light/dark is a user-facing product setting. First visit follows prefers-color-scheme; an explicit choice persists locally.
  - Share/deep links preserve locale with lang=zh or lang=en; Worker share metadata localizes to that locale.
  - Theme preference is client-only and does not affect anonymous voter identity.
  - Top roster art is the person's fixed default/neutral image.
  - SUBJECT art follows the current community leader image.
  - The large rank image follows the community leader after refresh until the user explicitly selects a rank; then it follows the user's selection.
  - Meme/image subjects use a mechanical pointer on the slider instead of repeating the rank image in the thumb.
  - Production delivery is zero-local: GitHub PR/CI -> main CI -> automatic serialized Deploy -> convergence/readiness/card/vote smoke checks.
  - Pure .chatgpt/**, docs/**, and README.md commits do not trigger production deployment.
  - The workers.dev URL is the v1 public launch origin; custom-domain work is deferred until there is a concrete branding need.
implemented:
  - Public product branding aligned to Awesome Fame Slider in the page header, browser title, Open Graph title, shared verdict pages, and generated social cards.
  - Persistent Chinese/English switch across app copy, person/rank labels, notices, controls, results, and share copy.
  - First-visit locale follows browser language; explicit locale is stored in localStorage and reflected in document language metadata.
  - Persistent light/dark switch with first-visit system-color preference, localStorage persistence, and pre-render theme bootstrapping to avoid a light-theme flash.
  - Dark theme is visually adapted to the existing paper/mechanical motif rather than implemented as a simple color inversion.
  - Share URLs preserve lang=zh/en; Worker-generated share-page titles, descriptions, link text, html lang, and X/OG metadata localize accordingly.
  - English rank labels use Latin surnames/names rather than mixed strings such as Jailed 梁.
  - Six-position rheostat, rank labels, community vote distribution, neutral zero-vote state, and neutral-biased tie breaking.
  - D1-backed anonymous vote upsert and per-network write limiter without raw IP persistence.
  - Aggregate polling every 30 seconds while visible plus refresh on foreground/person changes.
  - Worker share pages with Open Graph and X summary_large_image metadata.
  - Build-time generation of 48 exact 1200x675 PNG result cards with Sharp and build-time dimension assertions.
  - Versioned v6 X/OG card URLs invalidate earlier metadata/cache revisions.
  - Deploy waits for /api/health and /api/ready to report shareCardRev=6 before post-deploy verification, avoiding edge-propagation races.
  - Every Deploy performs a full 8-person x 6-rank production sweep of crawler metadata and actual PNG dimensions.
  - Every Deploy performs a self-cleaning anonymous-vote upsert smoke: the same temporary voter/person row moves ranks without duplication and is deleted afterward.
  - Mobile-safe layout, safe-area handling, horizontal roster scrolling, coarse-pointer native-share preference, Web Intent fallback, reduced-motion handling, and rank-image dissolve transition.
  - Fixed roster avatar, community SUBJECT image, and community-vs-explicit-selection large-image semantics.
  - Mechanical slider pointer for meme/image subjects.
  - Share flow preserves the selected rank; sharing never changes the D1 vote.
  - Configured remote assets are build-required; share-card generation fails rather than silently substituting the old illustrated avatar.
  - Liang Wenfeng full six-rank makerjackie/bianzu image pack.
  - Tibo Sottiaux full six-rank makerjackie/bianzu image pack.
  - Elon Musk full six-rank makerjackie/bianzu image pack.
  - Jensen Huang six-rank public Imgflip meme-template pack.
  - Mark Zuckerberg six-rank public Know Your Meme + Imgflip pack.
  - Sam Altman six-rank public Imgflip meme-template pack.
  - Dario Amodei six-rank public Imgflip Dario/Anthropic meme pack.
  - Demis Hassabis six-rank public interview-thumbnail image pack.
