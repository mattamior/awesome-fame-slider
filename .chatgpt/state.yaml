  - Earlier CI exposed and resolved workflow caching and Vite typing issues.
  - CI run 11 succeeded after rate limiting/readiness hardening.
  - CI run 18 (commit be4542b6687c9f60c5ba7d96bc38729f43378750) succeeded after removing fabricated fallback votes, adding live polling, and mobile hardening; npm install, Vite build, and Wrangler type generation passed.
