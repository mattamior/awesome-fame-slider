project: slide-rheostat
status: active
phase: implementation
repository: mattamior/slide-rheostat
updated_at: 2026-08-26
summary: >-
  slide-rheostat is a React + TypeScript meme/parody app with an eight-person roster,
  six-rank rheostat UI, aggregate vote display, Cloudflare Worker backend, D1 persistence,
  and an implemented X-native Share & Vote flow. The browser renders a 1200x675 PNG result
  card; the Worker uses OAuth 2.0 PKCE, uploads the image, creates the X Post, and records or
  updates the vote only after X returns a successful Post ID. Verified X copy now contains
  the person's actual verdict label, and zero-vote community state defaults to the neutral rank.
current_focus: >-
  Finish remote CI validation, then create the production D1 database, configure Cloudflare
  deployment and X Developer App credentials, deploy the Worker, run migrations, and verify
  the end-to-end live auth/media/post/vote loop.
confirmed_constraints:
  - Vite + React + TypeScript frontend.
  - Cloudflare Workers is the unified deployment target.
  - Cloudflare D1 stores current votes, share events, and short-lived pending OAuth shares.
  - Initial roster: Liang Wenfeng, Elon Musk, Sam Altman, Jensen Huang, Mark Zuckerberg, Dario Amodei, Demis Hassabis, and Tibo Sottiaux.
  - Sharing includes the user's selected rank/verdict and a generated PNG image.
  - A vote is recorded only after X confirms that the Post was successfully created.
  - One active vote per X account per person; later successful shares update that vote.
  - Each person page displays aggregate voting distribution and the modal community rank.
implemented:
  - React/Vite/TypeScript project scaffold and eight-person data-driven roster.
  - Six-position rheostat interaction, rank labels, community vote distribution, and leader display.
  - D1 votes/share_events schema plus oauth_pending migration.
  - Worker health and aggregate vote APIs.
  - Explicit Cloudflare static-asset routing so /api/* runs Worker-first.
  - X OAuth 2.0 Authorization Code with PKCE using tweet.read, tweet.write, users.read, and media.write.
  - Browser-generated 1200x675 PNG result card sent into the pending-share transaction.
  - X media upload and POST /2/tweets integration.
  - Verified Share & Vote persistence: insert share event and upsert one active vote per X user/person only after Post success.
  - Success/failure return states in the React UI; Web Intent fallback never records a vote.
  - Real localized verdict labels in verified X post text.
  - Neutral rank for zero-vote community state and neutral-biased tie-breaking.
  - Opportunistic cleanup of expired OAuth pending rows and explicit cancellation cleanup.
  - GitHub Actions CI workflow for npm install, build, and Wrangler type generation.
  - Vite client type declaration added after CI exposed the missing CSS module typing.
  - Deployment and OAuth setup documentation in README.
blockers:
  - No Cloudflare account integration/plugin is available in this environment, so D1 creation and production deploy cannot yet be executed here.
  - Production X Developer App Client ID/Secret and exact callback configuration are not available yet.
  - X API production use requires sufficient Developer Console credits.
validation_notes:
  - GitHub Actions CI is now active and provides the networked build environment unavailable to this runtime.
  - CI run 1 failed because npm cache was enabled without a lockfile; the workflow was corrected.
  - CI run 2 reached TypeScript and found the missing Vite client CSS declaration; src/vite-env.d.ts was added.
  - A subsequent CI run is validating the corrected frontend and Wrangler configuration.
