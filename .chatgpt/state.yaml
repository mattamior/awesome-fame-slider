summary: >-
  slide-rheostat is a React + TypeScript meme/parody app inspired by the 梁文锋“滑动变阻器/滑动变祖器” meme.
  The MVP codebase now includes an 8-person roster, six-rank rheostat UI, aggregate vote display,
  Cloudflare Worker API scaffold, D1 vote schema, and a Share-to-X entry point. The product is designed around
  an X-native share-and-vote loop where a successful authenticated X post records or updates one vote per X user/person.
current_focus: >-
  Complete authenticated X OAuth/media posting, create Cloudflare D1 resources, deploy the Worker, verify the live site,
  then refine portraits/share cards and production copy.
confirmed_constraints:
  - Vite + React + TypeScript frontend.
  - Cloudflare Workers is the unified deployment target.
  - Cloudflare D1 stores current votes and share events.
  - Initial roster: Liang Wenfeng, Elon Musk, Sam Altman, Jensen Huang, Mark Zuckerberg, Dario Amodei, Demis Hassabis, and Tibo Sottiaux.
  - Sharing must include the user's selected rank/verdict and an image.
  - A vote is recorded only after X confirms that the post was successfully created.
  - One active vote per X account per person; later successful shares update that vote.
  - Each person page displays aggregate voting distribution and the modal community rank.
implemented:
  - React/Vite/TypeScript project scaffold.
  - Eight-person data-driven roster.
  - Six-position rheostat interaction and rank labels.
  - Community vote distribution UI and leader display.
  - D1 migrations for votes and share_events.
  - Worker health endpoint and aggregate vote API.
  - X share/auth API placeholders that refuse to count unverified shares.
  - Wrangler configuration for a Worker serving both API and SPA assets.
blockers:
  - No connected Cloudflare account/tool is currently available to create D1 resources or deploy the Worker.
  - X Developer App credentials and OAuth callback configuration are not yet available.
  - Authenticated X media upload + post creation still needs implementation and verification against current X API behavior.
