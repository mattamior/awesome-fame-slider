confirmed_constraints:
  - Product display name is Slide Rheostat.
  - Frontend is Vite + React + TypeScript.
  - Cloudflare Workers is the unified deployment target; D1 stores anonymous active votes and rate-limit state.
  - Initial roster is Liang Wenfeng, Elon Musk, Sam Altman, Tibo Sottiaux, Jensen Huang, Mark Zuckerberg, Dario Amodei, and Demis Hassabis.
  - Voting and X sharing are independent actions.
  - One active anonymous vote is kept per browser device/person; later votes update that row.
  - Community results never fall back to fabricated sample votes.
  - X sharing uses free Web Intent / web share mechanics; no X Developer App or paid X write API is required.
  - Shared verdict pages expose crawler-friendly metadata and a 1200x675 PNG for the exact selected rank.
  - Top roster art is the person's fixed default/neutral image.
  - SUBJECT art follows the current community leader image.
  - The large rank image follows the community leader after refresh until the user explicitly selects a rank; then it follows the user's selection.
  - Meme subjects use a mechanical pointer on the slider instead of repeating the rank image in the thumb.
  - Production delivery is zero-local: GitHub PR/CI -> main CI -> automatic serialized Deploy -> health/readiness/social-card smoke checks.
  - Pure .chatgpt/**, docs/**, and README.md commits do not trigger production deployment.
implemented:
  - Six-position rheostat, rank labels, community vote distribution, neutral zero-vote state, and neutral-biased tie breaking.
  - D1-backed anonymous vote upsert and per-network write limiter without raw IP persistence.
  - Aggregate polling every 30 seconds while visible plus refresh on foreground/person changes.
  - Worker share pages with Open Graph and X summary_large_image metadata.
  - Build-time generation of 48 1200x675 PNG result cards with Sharp.
  - Mobile-safe layout, reduced-motion handling, and rank-image dissolve transition.
  - Fixed roster avatar, community SUBJECT image, and community-vs-explicit-selection large-image semantics.
  - Mechanical slider pointer for meme-pack subjects.
  - Share flow that preserves the selected rank; production X metadata/card smoke test runs after each deploy.
  - Configured meme-pack assets are build-required; share-card generation fails rather than silently substituting the old illustrated avatar if a configured source cannot be fetched.
  - Liang Wenfeng full six-rank makerjackie/bianzu image pack.
  - Tibo Sottiaux full six-rank makerjackie/bianzu image pack.
  - Elon Musk full six-rank makerjackie/bianzu image pack.
  - Jensen Huang six-rank public Imgflip meme-template pack.
  - Mark Zuckerberg six-rank public Imgflip/internet meme-template pack.
  - Sam Altman six-rank public Imgflip meme-template pack.
