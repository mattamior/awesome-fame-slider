name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Confirm deployment revision
        run: |
          echo "Deploying SHA: $DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build frontend and OG cards
        run: npm run build

      - name: Resolve production D1 database
        shell: bash
        run: |
          set -euo pipefail

          find_db_id() {
            npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const rows = JSON.parse(input);
                const db = rows.find((row) => row.name === "awesome-fame-slider-db");
                if (db) process.stdout.write(db.uuid || db.id || "");
              });
            '
          }

          db_id="$(find_db_id)"
          if [ -z "$db_id" ]; then
            echo "awesome-fame-slider-db not found; creating it"
            npx wrangler d1 create awesome-fame-slider-db
            db_id="$(find_db_id)"
          fi

          if [ -z "$db_id" ]; then
            echo "::error::Could not resolve the D1 database ID after provisioning"
            exit 1
          fi

          echo "Resolved awesome-fame-slider-db: $db_id"
          echo "CF_D1_DATABASE_ID=$db_id" >> "$GITHUB_ENV"

      - name: Prepare production Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('REPLACE_AFTER_D1_CREATE', process.env.CF_D1_DATABASE_ID);
          if (source.includes('REPLACE_AFTER_D1_CREATE')) throw new Error('D1 database id placeholder remains');
          fs.writeFileSync(path, source);
          NODE

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply awesome-fame-slider-db --remote

      - name: Deploy Worker and static assets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy | tee /tmp/wrangler-deploy.log
          deploy_url="$(grep -Eo 'https://awesome-fame-slider\.[[:alnum:].-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$deploy_url" ]; then
            echo "::error::Could not discover the deployed workers.dev URL from Wrangler output"
            exit 1
          fi
          echo "Deployed URL: $deploy_url"
          echo "DEPLOY_URL=$deploy_url" >> "$GITHUB_ENV"

      - name: Verify production health and readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking $DEPLOY_URL/api/health"
          curl --fail --show-error --silent "$DEPLOY_URL/api/health" | tee /tmp/health.json
          echo
          ready=0
          for attempt in $(seq 1 12); do
            echo "Readiness attempt $attempt/12"
            if curl --fail --show-error --silent "$DEPLOY_URL/api/ready" | tee /tmp/ready.json; then
              ready=1
              echo
              break
            fi
            echo
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Production readiness did not become healthy. Last response (if any):"
            cat /tmp/ready.json 2>/dev/null || true
            exit 1
          fi

      - name: Verify production X share card
        shell: bash
        run: |
          set -euo pipefail
          share_rev=4
          share_url="$DEPLOY_URL/share/liang/5?v=$share_rev"
          card_url="$DEPLOY_URL/share-cards/liang-5.png?v=$share_rev"

          echo "Checking crawler metadata at $share_url"
          curl --fail --show-error --silent \
            -A 'Twitterbot/1.0' \
            -D /tmp/share-headers.txt \
            -o /tmp/share.html \
            "$share_url"

          grep -F '<meta name="twitter:card" content="summary_large_image"' /tmp/share.html
          grep -F "<meta name=\"twitter:image\" content=\"$card_url\"" /tmp/share.html
          grep -F "<meta property=\"og:image\" content=\"$card_url\"" /tmp/share.html
          grep -F '<meta property="og:image:type" content="image/png"' /tmp/share.html
          if grep -F 'http-equiv="refresh"' /tmp/share.html; then
            echo "::error::Share page still contains a meta refresh that may interfere with card crawlers"
            exit 1
          fi

          echo "Checking selected share image at $card_url"
          curl --fail --show-error --silent \
            -A 'Twitterbot/1.0' \
            -D /tmp/card-headers.txt \
            -o /tmp/liang-5.png \
            "$card_url"
          tr -d '\r' < /tmp/card-headers.txt | grep -Ei '^content-type: image/png'
          test -s /tmp/liang-5.png
          echo "Production X-card smoke test passed"

      - name: Verify all 48 production share cards
        shell: bash
        run: |
          set -euo pipefail
          people=(liang musk altman tibo huang zuck dario demis)
          share_rev=4
          sweep_dir="$(mktemp -d)"

          for person in "${people[@]}"; do
            for rank in 0 1 2 3 4 5; do
              share_url="$DEPLOY_URL/share/$person/$rank?v=$share_rev&verify=$DEPLOY_SHA"
              card_url="$DEPLOY_URL/share-cards/$person-$rank.png?v=$share_rev"
              html="$sweep_dir/$person-$rank.html"
              headers="$sweep_dir/$person-$rank.headers"
              png="$sweep_dir/$person-$rank.png"

              echo "Checking $person rank $rank"
              curl --fail --show-error --silent \
                -A 'Twitterbot/1.0' \
                -o "$html" \
                "$share_url"

              grep -F '<meta name="twitter:card" content="summary_large_image"' "$html" >/dev/null
              grep -F "<meta name=\"twitter:image\" content=\"$card_url\"" "$html" >/dev/null
              grep -F "<meta property=\"og:image\" content=\"$card_url\"" "$html" >/dev/null
              grep -F '<meta property="og:image:type" content="image/png"' "$html" >/dev/null
              grep -F '<meta property="og:image:width" content="1200"' "$html" >/dev/null
              grep -F '<meta property="og:image:height" content="675"' "$html" >/dev/null
              if grep -F 'http-equiv="refresh"' "$html" >/dev/null; then
                echo "::error::$share_url contains a crawler-hostile meta refresh"
                exit 1
              fi

              curl --fail --show-error --silent \
                -A 'Twitterbot/1.0' \
                -D "$headers" \
                -o "$png" \
                "$card_url"
              tr -d '\r' < "$headers" | grep -Ei '^content-type: image/png' >/dev/null
              test -s "$png"
            done
          done

          SWEEP_DIR="$sweep_dir" node --input-type=module <<'NODE'
          import path from 'node:path';
          import sharp from 'sharp';

          const people = ['liang', 'musk', 'altman', 'tibo', 'huang', 'zuck', 'dario', 'demis'];
          for (const person of people) {
            for (let rank = 0; rank < 6; rank += 1) {
              const file = path.join(process.env.SWEEP_DIR, `${person}-${rank}.png`);
              const metadata = await sharp(file).metadata();
              if (metadata.format !== 'png' || metadata.width !== 1200 || metadata.height !== 675) {
                throw new Error(`${person}-${rank}.png is ${metadata.format} ${metadata.width}x${metadata.height}, expected png 1200x675`);
              }
            }
          }
          console.log('Verified all 48 production share pages and 48 versioned PNG cards at 1200x675');
          NODE

      - name: Verify production anonymous vote upsert
        shell: bash
        run: |
          set -euo pipefail
          person='demis'
          first_rank=1
          second_rank=4
          token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          voter_id="$(TOKEN="$token" node -e "const c=require('node:crypto');process.stdout.write(c.createHash('sha256').update('awesome-fame-slider-v1|voter|'+process.env.TOKEN).digest('base64url'))")"

          cleanup_vote() {
            npx wrangler d1 execute awesome-fame-slider-db --remote \
              --command "DELETE FROM anonymous_votes WHERE voter_id = '$voter_id' AND person_id = '$person';" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_vote EXIT
          cleanup_vote

          vote_url="$DEPLOY_URL/api/people/$person/vote"
          curl --fail --show-error --silent \
            -X POST \
            -H 'content-type: application/json' \
            -H "origin: $DEPLOY_URL" \
            -H "cookie: sr_voter=$token" \
            --data "{\"rank\":$first_rank}" \
            "$vote_url" >/tmp/vote-first.json

          first_state="$(npx wrangler d1 execute awesome-fame-slider-db --remote --json \
            --command "SELECT rank, COUNT(*) OVER () AS rows_for_voter FROM anonymous_votes WHERE voter_id = '$voter_id' AND person_id = '$person';" \
            | node -e '
                let input="";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data",chunk=>input+=chunk);
                process.stdin.on("end",()=>{
                  const payload=JSON.parse(input);
                  const rows=(Array.isArray(payload)?payload[0]?.results:payload?.results)||[];
                  if(rows.length!==1) process.exit(2);
                  process.stdout.write(`${rows[0].rank}:${rows[0].rows_for_voter}`);
                });
              ')"
          test "$first_state" = "$first_rank:1"

          curl --fail --show-error --silent \
            -X POST \
            -H 'content-type: application/json' \
            -H "origin: $DEPLOY_URL" \
            -H "cookie: sr_voter=$token" \
            --data "{\"rank\":$second_rank}" \
            "$vote_url" >/tmp/vote-second.json

          second_state="$(npx wrangler d1 execute awesome-fame-slider-db --remote --json \
            --command "SELECT rank, COUNT(*) OVER () AS rows_for_voter FROM anonymous_votes WHERE voter_id = '$voter_id' AND person_id = '$person';" \
            | node -e '
                let input="";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data",chunk=>input+=chunk);
                process.stdin.on("end",()=>{
                  const payload=JSON.parse(input);
                  const rows=(Array.isArray(payload)?payload[0]?.results:payload?.results)||[];
                  if(rows.length!==1) process.exit(2);
                  process.stdout.write(`${rows[0].rank}:${rows[0].rows_for_voter}`);
                });
              ')"
          test "$second_state" = "$second_rank:1"

          cleanup_vote
          remaining="$(npx wrangler d1 execute awesome-fame-slider-db --remote --json \
            --command "SELECT COUNT(*) AS count FROM anonymous_votes WHERE voter_id = '$voter_id' AND person_id = '$person';" \
            | node -e '
                let input="";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data",chunk=>input+=chunk);
                process.stdin.on("end",()=>{
                  const payload=JSON.parse(input);
                  const rows=(Array.isArray(payload)?payload[0]?.results:payload?.results)||[];
                  process.stdout.write(String(rows[0]?.count ?? -1));
                });
              ')"
          test "$remaining" = '0'
          trap - EXIT
          echo 'Production anonymous vote upsert smoke test passed and temporary vote was removed'
