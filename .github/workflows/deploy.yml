name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
  APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
  X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
  X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_D1_DATABASE_ID APP_ORIGIN X_CLIENT_ID X_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare production Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let source = fs.readFileSync(path, 'utf8');
          const origin = process.env.APP_ORIGIN.replace(/\/$/, '');
          source = source
            .replace('REPLACE_AFTER_D1_CREATE', process.env.CF_D1_DATABASE_ID)
            .replace('https://slide-rheostat.workers.dev', origin);
          if (source.includes('REPLACE_AFTER_D1_CREATE')) throw new Error('D1 database id placeholder remains');
          fs.writeFileSync(path, source);
          NODE

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply slide-rheostat-db --remote

      - name: Deploy Worker and static assets
        run: npx wrangler deploy

      - name: Configure X OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$X_CLIENT_ID" | npx wrangler secret put X_CLIENT_ID
          printf '%s' "$X_CLIENT_SECRET" | npx wrangler secret put X_CLIENT_SECRET

      - name: Verify production health and readiness
        shell: bash
        run: |
          set -euo pipefail
          origin="${APP_ORIGIN%/}"
          curl --fail --show-error --silent "$origin/api/health" | tee /tmp/health.json
          ready=0
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent "$origin/api/ready" | tee /tmp/ready.json; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Production readiness did not become healthy"
            exit 1
          fi
