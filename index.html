<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe5cf" />
    <script>
      (() => {
        try {
          const params = new URLSearchParams(location.search);
          const requestedLocale = params.get('lang');
          const storedLocale = localStorage.getItem('afs_locale');
          const locale = requestedLocale === 'zh' || requestedLocale === 'en'
            ? requestedLocale
            : storedLocale === 'zh' || storedLocale === 'en'
              ? storedLocale
              : navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
          document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';

          const storedTheme = localStorage.getItem('afs_theme');
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171511' : '#efe5cf';
        } catch {}
      })();
    </script>
    <meta name="description" content="Slide the internet's reputation rheostat and cast your vote by sharing to X." />
    <meta property="og:title" content="Awesome Fame Slider" />
    <meta property="og:description" content="Pick a person. Slide their status. Share your verdict." />
    <title>Awesome Fame Slider</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
